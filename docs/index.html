<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GVG&ARTEFAL — Painel Interno</title>
<meta name="description" content="Painel interno GVG&ARTEFAL com o módulo Pedidos.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1117">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GVG&ARTEFAL">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f6f3ec}
  iframe{display:block;width:100%;height:100%;border:0;background:#f6f3ec}
  .gvgInstallHelp{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:rgba(5,10,15,.74);backdrop-filter:blur(4px);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .gvgInstallHelp .box{width:min(430px,100%);padding:26px 24px 22px;border-radius:22px;background:linear-gradient(160deg,#16212b,#0b1117);border:1px solid rgba(241,210,124,.28);box-shadow:0 24px 70px rgba(0,0,0,.5);color:#f7f2e6;text-align:center}
  .gvgInstallHelp img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 14px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  .gvgInstallHelp h2{margin:0 0 8px;font-size:19px;letter-spacing:-.4px}
  .gvgInstallHelp p{margin:0;color:#b9c9cf;font-size:12px;line-height:1.6}
  .gvgInstallHelp p+p{margin-top:9px}
  .gvgInstallHelp b{color:#f1d27c}
  .gvgInstallHelp button{margin-top:18px;border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#d9ae45,#b98520);color:#1c1508;font-weight:900;font-size:13px;cursor:pointer}
</style>
</head>
<body>
  <iframe id="gvgAppFrame" src="https://script.google.com/macros/s/AKfycby35-KiTddoqhEuo9zalGkVC2Wfspw5lG7i9Vt-_qJXZBa_wqeyiV51_42xh4ITtHhL/exec" allow="storage-access; clipboard-write" title="Painel GVG&ARTEFAL"></iframe>
<script>
  var deferredInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();deferredInstallPrompt=event;});
  window.addEventListener('appinstalled',function(){deferredInstallPrompt=null;});
  function showInstallHelp(){
    if(document.getElementById('gvgInstallHelp'))return;
    var wrap=document.createElement('div');
    wrap.id='gvgInstallHelp';wrap.className='gvgInstallHelp';
    wrap.innerHTML='<div class="box"><img src="icon-192.png" alt=""><h2>Instalar o GVG&ARTEFAL</h2><p><b>Android / Chrome:</b> abra o menu ⋮ e toque em <b>Instalar app</b>.</p><p><b>iPhone / Safari:</b> toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p><button type="button" id="gvgInstallClose">Entendi</button></div>';
    document.body.appendChild(wrap);
    document.getElementById('gvgInstallClose').onclick=function(){wrap.remove();};
  }
  window.addEventListener('message',function(event){
    var origin=String(event.origin||'');
    if(!/^https:\/\/script\.google\.com$/.test(origin) && !/^https:\/\/[^/]+\.googleusercontent\.com$/.test(origin))return;
    if(!event.data||event.data.type!=='gvg-install-app')return;
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.catch(function(){}).finally(function(){deferredInstallPrompt=null;});
    }else{
      showInstallHelp();
    }
  });
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}
</script>
</body>
</html>
