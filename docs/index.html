<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GVG&ARTEFAL — Painel Interno</title>
<meta name="description" content="Painel interno GVG&ARTEFAL com Order Catalog, Gastos, Fornecedores, Máquinas e Frotas.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<meta name="theme-color" content="#0b1117">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GVG&ARTEFAL">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f6f3ec}
  iframe{display:block;width:100%;height:100%;border:0;background:#f6f3ec}
  #gvgBoot{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;padding:22px;background:radial-gradient(80% 70% at 50% 0%,#fff9eb 0%,#f6f3ec 55%,#ece5d8 100%);color:#12313e;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .35s ease}
  #gvgBoot.is-hidden{opacity:0;pointer-events:none}
  .gvg-boot-card{width:min(310px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
  .gvg-boot-card img{width:66px;height:66px;border-radius:17px;box-shadow:0 10px 24px #6d54221f}
  .gvg-boot-card strong{font-size:17px;letter-spacing:-.3px;color:#12313e}
  .gvg-boot-card span{font-size:11px;color:#6f7e82;line-height:1.45;min-height:16px}
  .gvg-boot-spinner{width:30px;height:30px;border-radius:50%;border:2px solid #d9cdb7;border-top-color:#b98520;animation:gvgBootSpin .9s linear infinite;margin:2px 0}
  #gvgBootRetry{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:10px 18px;background:#12313e;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
  #gvgBootRetry[hidden]{display:none!important}
  @keyframes gvgBootSpin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.gvg-boot-spinner{animation:none}}
  .gvgInstallHelp{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:rgba(5,10,15,.74);backdrop-filter:blur(4px);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .gvgInstallHelp .box{width:min(430px,100%);padding:26px 24px 22px;border-radius:22px;background:linear-gradient(160deg,#16212b,#0b1117);border:1px solid rgba(241,210,124,.28);box-shadow:0 24px 70px rgba(0,0,0,.5);color:#f7f2e6;text-align:center}
  .gvgInstallHelp img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 14px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  .gvgInstallHelp h2{margin:0 0 8px;font-size:19px;letter-spacing:-.4px}
  .gvgInstallHelp p{margin:0;color:#b9c9cf;font-size:12px;line-height:1.6}
  .gvgInstallHelp p+p{margin-top:9px}
  .gvgInstallHelp b{color:#f1d27c}
  .gvgInstallHelp button{margin-top:18px;border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#d9ae45,#b98520);color:#1c1508;font-weight:900;font-size:13px;cursor:pointer}
</style>
</head>
<body>
  <iframe id="gvgAppFrame" src="about:blank" allow="storage-access; clipboard-write" loading="eager" title="Painel GVG&ARTEFAL"></iframe>
  <div id="gvgBoot" role="status" aria-live="polite"><div class="gvg-boot-card"><img src="icon-192.png" alt=""><strong>Carregando o painel…</strong><div class="gvg-boot-spinner" aria-hidden="true"></div><span id="gvgBootMsg">Conectando ao ambiente seguro.</span><button type="button" id="gvgBootRetry" hidden>Tentar novamente</button></div></div>
<script>
  (function(){
    var frame=document.getElementById('gvgAppFrame');
    var params=new URLSearchParams(window.location.search);
    var qs='v=143&ui=conferencia-link';
    var modulo=params.get('modulo');
    if(params.get('conferir'))modulo='pedidos';
    if(modulo)qs+='&modulo='+encodeURIComponent(modulo);
    if(params.get('view'))qs+='&view='+encodeURIComponent(params.get('view'));
    if(params.get('alerta'))qs+='&alerta='+encodeURIComponent(params.get('alerta'));
    if(params.get('conferir'))qs+='&conferir='+encodeURIComponent(params.get('conferir'));
    if(params.get('token'))qs+='&token='+encodeURIComponent(params.get('token'));
    frame.src='https://script.google.com/macros/s/AKfycby35-KiTddoqhEuo9zalGkVC2Wfspw5lG7i9Vt-_qJXZBa_wqeyiV51_42xh4ITtHhL/exec?'+qs;
    var boot=document.getElementById('gvgBoot'),bootMsg=document.getElementById('gvgBootMsg'),retry=document.getElementById('gvgBootRetry');
    var slowTimer=setTimeout(function(){if(bootMsg)bootMsg.textContent='A conexão está demorando um pouco. Aguarde…';},15000);
    var failTimer=setTimeout(function(){if(bootMsg)bootMsg.textContent='Não foi possível carregar agora. Verifique a internet.';if(retry)retry.hidden=false;},45000);
    function hideBoot(){clearTimeout(slowTimer);clearTimeout(failTimer);if(!boot)return;boot.classList.add('is-hidden');setTimeout(function(){if(boot&&boot.parentNode)boot.parentNode.removeChild(boot);},450);}
    if(retry)retry.onclick=function(){retry.hidden=true;if(bootMsg)bootMsg.textContent='Tentando novamente…';clearTimeout(slowTimer);clearTimeout(failTimer);var base=String(frame.src||'').split('&_retry=')[0];frame.src=base+'&_retry='+Date.now();slowTimer=setTimeout(function(){if(bootMsg)bootMsg.textContent='A conexão está demorando um pouco. Aguarde…';},15000);failTimer=setTimeout(function(){if(bootMsg)bootMsg.textContent='Não foi possível carregar agora. Verifique a internet.';retry.hidden=false;},45000);};
    window.addEventListener('message',function(event){var origin=String(event.origin||'');if(!/^https:\/\/script\.google\.com$/.test(origin)&&!/^https:\/\/[^/]+\.googleusercontent\.com$/.test(origin))return;if(event.data&&event.data.type==='gvg-panel-ready')hideBoot();});
  })();
  var deferredInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();deferredInstallPrompt=event;});
  window.addEventListener('appinstalled',function(){deferredInstallPrompt=null;});
  function showInstallHelp(){
    if(document.getElementById('gvgInstallHelp'))return;
    var wrap=document.createElement('div');
    wrap.id='gvgInstallHelp';wrap.className='gvgInstallHelp';
    wrap.innerHTML='<div class="box"><img src="icon-192.png" alt=""><h2>Instalar o GVG&ARTEFAL</h2><p><b>Android / Chrome:</b> abra o menu ⋮ e toque em <b>Instalar app</b>.</p><p><b>iPhone / Safari:</b> toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</p><button type="button" id="gvgInstallClose">Entendi</button></div>';
    document.body.appendChild(wrap);
    document.getElementById('gvgInstallClose').onclick=function(){wrap.remove();};
  }
  window.addEventListener('message',function(event){
    var origin=String(event.origin||'');
    if(!/^https:\/\/script\.google\.com$/.test(origin) && !/^https:\/\/[^/]+\.googleusercontent\.com$/.test(origin))return;
    if(!event.data||event.data.type!=='gvg-install-app')return;
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.catch(function(){}).finally(function(){deferredInstallPrompt=null;});
    }else{
      showInstallHelp();
    }
  });
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}
</script>
</body>
</html>
